server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Compress text assets so the first, uncached page load has less to download.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Keep redirects relative so a proxy like Traefik doesn't get the wrong scheme or port.
    absolute_redirect off;

    rewrite ^/docs$ /docs/guide/install-build permanent;
    rewrite ^/docs/guide$ /docs/guide/install-build permanent;

    # Skip the redirect-to-add-trailing-slash round trip, so docs page navigation feels faster.
    location / {
        try_files $uri $uri/index.html $uri/ =404;
    }
}
